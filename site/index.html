<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weighted Dice</title>
  <link rel="stylesheet" href="styles.css?v=weighted-dice">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <p class="eyebrow">Midnight Season 2</p>
      <h1>Weighted Dice</h1>
    </div>
    <form class="filters" autocomplete="off">
      <label>
        <span>Class</span>
        <select id="class-select"></select>
      </label>
      <label>
        <span>Spec</span>
        <select id="spec-select"></select>
      </label>
    </form>
    <div class="pref">
      <span>Stat priority</span>
      <ol id="stat-order" class="stat-order"></ol>
    </div>
    <div class="pref setup">
      <fieldset class="weapon-style">
        <legend>Weapons</legend>
        <label><input type="radio" name="weapon-style" value="2h"> 2-handed</label>
        <label><input type="radio" name="weapon-style" value="mhoh"> MH/OH</label>
      </fieldset>
    </div>
  </header>

  <main>
    <div class="table-scroll">
      <table id="loot-table">
        <thead></thead>
        <tbody></tbody>
        <tfoot></tfoot>
      </table>
    </div>
    <section class="bonus-summary" aria-labelledby="bonus-heading">
      <h2 id="bonus-heading">Won by bonus roll</h2>
      <div id="bonus-wins"></div>
    </section>
  </main>

  <script src="loot-data.js"></script>
  <script src="spec-stat-defaults.js"></script>
  <script src="app.js?v=weighted-dice"></script>
</body>
</html>
